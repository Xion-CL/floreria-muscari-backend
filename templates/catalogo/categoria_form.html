{% extends 'base.html' %}
{% block title %}{{ titulo }} - La Cabaña de Muscari{% endblock %}
{% block content %}
<div class="page-narrow">
  <div class="card-box">
    <h1 class="page-title">{{ titulo }}</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include 'partials/form_fields.html' %}
      <div class="actions-row"><a class="btn-light" href="{% url 'catalogo:panel_categorias' %}">Cancelar</a><button class="btn-primary" type="submit"><i class="fas fa-save"></i> Guardar</button></div>
    </form>
  </div>
</div>
{% endblock %}
