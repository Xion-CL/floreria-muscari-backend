{% extends 'base.html' %}
{% block title %}Registrar movimiento - La Cabaña de Muscari{% endblock %}
{% block content %}
<div class="page-narrow">
  <div class="card-box">
    <h1 class="page-title">Registrar movimiento de stock</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include 'partials/form_fields.html' %}
      <div class="actions-row"><a class="btn-light" href="{% url 'inventario:inventario' %}">Cancelar</a><button class="btn-primary" type="submit">Registrar</button></div>
    </form>
  </div>
</div>
{% endblock %}
