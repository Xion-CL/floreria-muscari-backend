{% extends 'base.html' %}
{% block title %}{{ titulo }} - La Cabaña de Muscari{% endblock %}
{% block content %}
<div class="page-narrow">
  <div class="card-box center">
    <div class="big-icon danger"><i class="fas fa-trash-alt"></i></div>
    <h1 class="page-title">{{ titulo }}</h1>
    <p>¿Seguro que quieres eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
    <form method="post" class="actions-row">
      {% csrf_token %}
      <a class="btn-light" href="{{ cancelar_url }}">Cancelar</a>
      <button type="submit" class="btn-danger"><i class="fas fa-trash"></i> Sí, eliminar</button>
    </form>
  </div>
</div>
{% endblock %}
